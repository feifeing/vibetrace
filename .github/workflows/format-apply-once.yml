name: One-shot format apply

on:
  push:
    branches:
      - codex/patchoath-brand-migration

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'feifeing/vibetrace' && github.ref == 'refs/heads/codex/patchoath-brand-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/patchoath-brand-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit deterministic formatting and remove this one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/format-apply-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply deterministic PatchOath formatting"
          git push origin HEAD:codex/patchoath-brand-migration
