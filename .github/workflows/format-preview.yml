name: Format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write docs/change-contract.md
          git diff --no-color -- docs/change-contract.md
